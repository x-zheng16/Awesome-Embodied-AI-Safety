# Regenerates the self-hosted Star History SVGs weekly using the repo's OWN
# GITHUB_TOKEN (not the shared, rate-limited pool that api.star-history.com hits).
name: Refresh Star History

on:
  schedule:
    - cron: "17 6 * * 1"        # Mondays 06:17 UTC
  workflow_dispatch: {}          # manual "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # gh is preinstalled on the runner
        run: |
          python3 tools/gen_star_history.py \
            --repo "${{ github.repository }}" \
            --out-dir assets

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.svg assets/star-history-dark.svg
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh star history chart"
            git push
          fi
